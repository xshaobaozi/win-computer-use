<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Agent 感知测试页</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 40px; color: #222; }
  h1 { font-size: 20px; }
  .row { margin: 12px 0; }
  label { display: inline-block; width: 100px; }
  input, select { padding: 4px 6px; width: 240px; }
  button { padding: 6px 16px; margin-right: 8px; cursor: pointer; }
  table { border-collapse: collapse; margin-top: 16px; }
  td, th { border: 1px solid #ccc; padding: 6px 12px; text-align: left; }
  #out { margin-top: 16px; padding: 8px; background: #f4f4f4; }
</style>
</head>
<body>
<h1>订单录入（感知测试）</h1>
<div class="row"><label for="customer">客户名称</label><input id="customer" name="customer" placeholder="请输入客户名称"></div>
<div class="row"><label for="amount">订单金额</label><input id="amount" name="amount" type="number" placeholder="0.00"></div>
<div class="row"><label for="region">所属区域</label>
  <select id="region" name="region"><option>华东</option><option>华南</option><option>华北</option></select>
</div>
<div class="row"><label for="urgent">加急</label><input id="urgent" type="checkbox" name="urgent"></div>
<div class="row">
  <button id="submit" type="button">提交订单</button>
  <button id="reset" type="button">重置</button>
</div>
<table>
  <thead><tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th></tr></thead>
  <tbody>
    <tr><td>SO-1001</td><td>杭州云图</td><td>12,800</td><td>已审核</td></tr>
    <tr><td>SO-1002</td><td>深圳锐驰</td><td>36,400</td><td>待审核</td></tr>
  </tbody>
</table>
<div id="out" aria-live="polite">等待提交…</div>
<script>
  document.getElementById('submit').addEventListener('click', () => {
    const c = document.getElementById('customer').value || '(空)';
    const a = document.getElementById('amount').value || '0';
    document.getElementById('out').textContent = '提交成功：' + c + ' / ' + a;
  });
</script>
</body>
</html>
